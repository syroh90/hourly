<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시간일기">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>시간일기</title>
<style>
:root{
  --bg:#f3f4f1;--card:#ffffff;--ink:#1b1e1f;--muted:#657072;--line:#e0e4e1;--chip:#eef1ee;
  --accent:#2c6e70;--on-accent:#ffffff;--urge:#b4532a;--ok:#2f7d5b;--warn:#b3412e;
  --m1:#b3412e;--m2:#d08a3c;--m3:#9aa3a4;--m4:#5d9a7c;--m5:#2f7d5b;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121517;--card:#1b1f21;--ink:#eef1f1;--muted:#9aa5a7;--line:#2a3033;--chip:#242a2c;
    --accent:#7cc6c4;--on-accent:#0f1a1a;--urge:#f0a070;--ok:#6cc79c;--warn:#ef8a78;
    --m1:#ef8a78;--m2:#f0b56c;--m3:#8d9799;--m4:#86c3a2;--m5:#6cc79c;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121517;--card:#1b1f21;--ink:#eef1f1;--muted:#9aa5a7;--line:#2a3033;--chip:#242a2c;
  --accent:#7cc6c4;--on-accent:#0f1a1a;--urge:#f0a070;--ok:#6cc79c;--warn:#ef8a78;
  --m1:#ef8a78;--m2:#f0b56c;--m3:#8d9799;--m4:#86c3a2;--m5:#6cc79c;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;word-break:keep-all;overflow-wrap:anywhere;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:26px;margin:8px 0 12px;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:600}
.q small{font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 13px;font-size:15px;line-height:1.2;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.egroup{font-size:12px;font-weight:600;color:var(--muted);margin:14px 2px 7px}
.egroup:first-of-type{margin-top:0}
.urges .chip[aria-pressed="true"]{background:var(--urge);color:#fff}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:13px;line-height:1.2;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.scale button b{font-size:17px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.crave{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.crave button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-variant-numeric:tabular-nums}
.crave button[aria-pressed="true"]{background:var(--urge);color:#fff;border-color:transparent}
input[type="text"],textarea,input[type="date"]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:76px}
.primary,.secondary,.danger{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;margin-top:8px;position:relative}
.primary{border:0;background:var(--accent);color:var(--on-accent)}
.secondary{border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.danger{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:transparent;color:var(--warn);font-weight:600;font-size:16px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.slotbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slotbar::-webkit-scrollbar{display:none}
.slot{flex:none;min-width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.1}
.slot i{font-style:normal;font-size:11px;color:var(--muted)}
.slot.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.slot.done i{color:var(--ok)}
.slot.missed i{color:var(--warn)}
.slot.future{opacity:.5}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.slot[aria-pressed="true"] i{color:inherit}
.slothead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.slothead b{font-size:22px;letter-spacing:-.02em}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:18px}
.daynav b{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--chip);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.tl{padding:0;overflow:hidden}
.tl-row{display:grid;grid-template-columns:44px 1fr;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px}
.tl-row:last-child{border-bottom:0}
.tl-h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:2px}
.tl-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.tl-doing{font-weight:600}
.tl-meta{font-size:13px;color:var(--muted)}
.tl-urge{font-size:13px;color:var(--urge)}
.tl-note{font-size:14px;color:var(--muted);white-space:pre-wrap}
.tl-empty{color:var(--muted);font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.bar span:nth-child(2){height:10px;border-radius:5px;background:var(--chip);overflow:hidden;position:relative}
.bar span:nth-child(2) i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar.u span:nth-child(2) i{background:var(--urge)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.insight{border-top:1px solid var(--line);padding:10px 0}
.insight:first-of-type{border-top:0;padding-top:2px}
.insight b{color:var(--urge)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .b-mood{fill:var(--accent)} .chart .b-urge{fill:var(--urge)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{text-align:center;padding:28px 16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:transparent;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="view-now"></section>
  <section id="view-day" hidden></section>
  <section id="view-pattern" hidden></section>
  <section id="view-more" hidden></section>
</main>
<nav class="tabs" aria-label="메뉴"><div>
  <button data-act="tab" data-v="now" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>기록</button>
  <button data-act="tab" data-v="day"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>하루</button>
  <button data-act="tab" data-v="pattern"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>패턴</button>
  <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5"/><path d="M4 17v2.5h16V17"/></svg>설정</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
